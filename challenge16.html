<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var gift = ['cheese', 'fruit', 'wine', 'cake'];
        var name = prompt("Enter your name:");
        function hello(name, gift) {
            if (name === null || name.trim().length === 0 || name === undefined) {
            name = "Incognito";
        }
            console.log(`Hello and welcome, ${name}!`);
            var position = Math.floor(Math.random() * gift.length);
            var food = gift[position];
            console.log(`Would you like some ${food}, ${name}!`);
           
        } 
        hello(name, gift);
    </script>
</body>
</html>
